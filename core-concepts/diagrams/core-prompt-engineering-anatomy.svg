<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #536174; }
      .tiny { font-size: 13px; fill: #64748b; }
      .chip { font-size: 13px; font-weight: 600; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <rect width="1440" height="900" fill="url(#paper)"/>

  <text x="55" y="55" class="title">Prompt 在一次请求中的位置</text>
  <text x="55" y="83" class="subtitle">左侧决定模型“倾向于做什么”，右侧决定系统“允许发生什么”；底层权重决定模型为什么会听指令</text>

  <!-- Regions -->
  <rect x="45" y="120" width="790" height="640" rx="24" fill="#f8fbff" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <rect x="1085" y="120" width="310" height="640" rx="24" fill="#fffaf2" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <rect x="45" y="790" width="1350" height="80" rx="20" fill="#fbf9ff" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>

  <!-- Connectors (drawn before nodes) -->
  <path d="M835 440 H878" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1040 440 H1062 V230 H1108" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1240 270 V328" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1240 410 V468" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1240 550 V608" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M960 790 V522" class="line" stroke="#7c3aed" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#arrow-purple)"/>

  <!-- Region titles -->
  <text x="70" y="157" class="region-title" fill="#2563eb">① 模型可见的 prompt（按装配顺序，自上而下）</text>
  <text x="1105" y="157" class="region-title" fill="#ea580c">② Harness 强制层</text>
  <text x="1105" y="178" class="tiny">不写在 prompt 里</text>
  <text x="70" y="838" class="region-title" fill="#7c3aed">③ 模型权重</text>
  <text x="200" y="838" class="node-sub">预训练 + 指令微调 + RLHF：学会“按指令行事”；部分厂商还专门训练 system / developer 优先于 user 与工具输出的指令层级</text>

  <!-- Left stack -->
  <g>
    <rect x="75" y="190" width="730" height="92" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="100" y="226" class="node-title">system / developer 指令</text>
    <text x="100" y="256" class="node-sub">角色与目标、规则背后的动机、行为边界、输出合同</text>
    <rect x="655" y="218" width="126" height="34" rx="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="718" y="240" class="chip" fill="#2563eb" text-anchor="middle">开发者可信</text>
  </g>
  <g>
    <rect x="75" y="300" width="730" height="92" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <text x="100" y="336" class="node-title">工具定义</text>
    <text x="100" y="366" class="node-sub">名称、描述、参数 schema：同样被模型当作 prompt 阅读</text>
    <rect x="655" y="328" width="126" height="34" rx="17" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="718" y="350" class="chip" fill="#7c3aed" text-anchor="middle">开发者可信</text>
  </g>
  <g>
    <rect x="75" y="410" width="730" height="92" rx="16" fill="#ffffff" stroke="#f472b6" stroke-width="2"/>
    <text x="100" y="446" class="node-title">长文档与检索内容 &lt;documents&gt;</text>
    <text x="100" y="476" class="node-sub">文件、网页、工具输出：长材料放在前部，并带上来源标签</text>
    <rect x="655" y="438" width="126" height="34" rx="17" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.6"/>
    <text x="718" y="460" class="chip" fill="#db2777" text-anchor="middle">不可信数据</text>
  </g>
  <g>
    <rect x="75" y="520" width="730" height="92" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="556" class="node-title">少样本示例 &lt;examples&gt;</text>
    <text x="100" y="586" class="node-sub">3–5 个相关、多样、格式一致的示例，与指令分开包裹</text>
    <rect x="655" y="548" width="126" height="34" rx="17" fill="#ecfdf5" stroke="#34d399" stroke-width="1.6"/>
    <text x="718" y="570" class="chip" fill="#059669" text-anchor="middle">开发者可信</text>
  </g>
  <g>
    <rect x="75" y="630" width="730" height="92" rx="16" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="666" class="node-title">用户问题与格式要求</text>
    <text x="100" y="696" class="node-sub">问题放在末尾；需要推理时开启 thinking 或要求先分析再作答</text>
    <rect x="655" y="658" width="126" height="34" rx="17" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="718" y="680" class="chip" fill="#b45309" text-anchor="middle">用户输入</text>
  </g>

  <!-- Model -->
  <rect x="880" y="360" width="160" height="160" rx="22" fill="#ffffff" stroke="#172033" stroke-width="2.4" filter="url(#rough)"/>
  <text x="960" y="425" class="node-title" text-anchor="middle">模型</text>
  <text x="960" y="452" class="node-sub" text-anchor="middle">一次采样</text>
  <text x="960" y="476" class="tiny" text-anchor="middle">文本 / tool call</text>
  <text x="960" y="232" class="tiny" text-anchor="middle">注入文本能改变</text>
  <text x="960" y="254" class="tiny" text-anchor="middle">模型“想做什么”</text>
  <text x="960" y="286" class="tiny" text-anchor="middle">“能做什么”</text>
  <text x="960" y="308" class="tiny" text-anchor="middle">由右侧决定</text>

  <!-- Right chain -->
  <g>
    <rect x="1110" y="190" width="260" height="80" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="1240" y="224" class="node-title" text-anchor="middle">输出校验</text>
    <text x="1240" y="250" class="node-sub" text-anchor="middle">结构化输出 / schema</text>
  </g>
  <g>
    <rect x="1110" y="330" width="260" height="80" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="1240" y="364" class="node-title" text-anchor="middle">权限策略与审批</text>
    <text x="1240" y="390" class="node-sub" text-anchor="middle">最小权限、人工确认</text>
  </g>
  <g>
    <rect x="1110" y="470" width="260" height="80" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="1240" y="504" class="node-title" text-anchor="middle">沙箱与网络出口</text>
    <text x="1240" y="530" class="node-sub" text-anchor="middle">文件、进程、域名白名单</text>
  </g>
  <g>
    <rect x="1110" y="610" width="260" height="80" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="1240" y="644" class="node-title" text-anchor="middle">执行与审计</text>
    <text x="1240" y="670" class="node-sub" text-anchor="middle">结果回填、trace 留存</text>
  </g>
</svg>
