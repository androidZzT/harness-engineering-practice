<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 730">
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#db2777"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #536174; }
      .tiny { font-size: 12px; fill: #64748b; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-size: 12.5px; fill: #172033; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#paper)"/>
  <text x="55" y="55" class="title">推理方法演进：从外部编排搜索到训练进模型</text>
  <text x="55" y="83" class="subtitle">越往右，尝试、检查与回退越多地发生在一次生成内部；调用方需要编排的越少，看到的也越少</text>

  <!-- Regions -->
  <rect x="45" y="115" width="315" height="505" rx="24" fill="#f8fbff" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <rect x="390" y="115" width="315" height="505" rx="24" fill="#f5fdf8" stroke="#34d399" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <rect x="735" y="115" width="315" height="505" rx="24" fill="#fffaf2" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <rect x="1080" y="115" width="315" height="505" rx="24" fill="#fbf9ff" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>

  <!-- Connectors: CoT -->
  <path d="M202 229 V251" class="line" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M202 299 V321" class="line" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M202 369 V391" class="line" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M202 439 V461" class="line" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>

  <!-- Connectors: Self-consistency -->
  <path d="M547 229 V244 H447 V256" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M547 229 V256" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M547 229 V244 H647 V256" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M447 296 V321" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M547 296 V321" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M647 296 V321" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M447 361 V386" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M547 361 V386" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M647 361 V386" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M447 426 V443 H507 V461" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M547 426 V461" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <path d="M647 426 V443 H587 V461" class="line" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>

  <!-- Connectors: ToT -->
  <path d="M892 229 V244 H812 V256" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <path d="M892 229 V256" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <path d="M892 229 V244 H972 V256" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <path d="M812 296 V312 H772 V326" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <path d="M812 296 V312 H852 V326" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
  <path d="M852 366 V391" class="line" stroke="#ea580c" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
    <path d="M756 340 C 742 310, 752 282, 776 278" class="line" stroke="#db2777" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-pink)"/>

  <!-- CoT nodes -->
  <text x="65" y="150" class="region-title" fill="#2563eb">① Chain-of-Thought</text>
  <rect x="112" y="185" width="180" height="44" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="213" class="node-title" text-anchor="middle">问题</text>
  <rect x="112" y="255" width="180" height="44" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="283" class="node-sub" text-anchor="middle">中间步骤 1</text>
  <rect x="112" y="325" width="180" height="44" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="353" class="node-sub" text-anchor="middle">中间步骤 2</text>
  <rect x="112" y="395" width="180" height="44" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="202" y="423" class="node-sub" text-anchor="middle">中间步骤 3</text>
  <rect x="112" y="465" width="180" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="202" y="493" class="node-title" text-anchor="middle">答案</text>
  <text x="202" y="556" class="node-sub" text-anchor="middle">1 次调用 · 单链贪心解码</text>
  <text x="202" y="580" class="tiny" text-anchor="middle">示例或“逐步思考”诱导；一步错全链错</text>

  <!-- Self-consistency nodes -->
  <text x="410" y="150" class="region-title" fill="#16a34a">② Self-Consistency</text>
  <rect x="457" y="185" width="180" height="44" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="547" y="213" class="node-title" text-anchor="middle">问题</text>
  <g>
    <rect x="412" y="260" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="447" y="283" class="tiny" text-anchor="middle">路径 1</text>
    <rect x="512" y="260" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="547" y="283" class="tiny" text-anchor="middle">路径 2</text>
    <rect x="612" y="260" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="647" y="283" class="tiny" text-anchor="middle">路径 N</text>
    <rect x="412" y="325" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="447" y="348" class="tiny" text-anchor="middle">……</text>
    <rect x="512" y="325" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="547" y="348" class="tiny" text-anchor="middle">……</text>
    <rect x="612" y="325" width="70" height="36" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.8"/>
    <text x="647" y="348" class="tiny" text-anchor="middle">……</text>
    <rect x="412" y="390" width="70" height="36" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="447" y="413" class="tiny" text-anchor="middle" fill="#15803d">答 A</text>
    <rect x="512" y="390" width="70" height="36" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="547" y="413" class="tiny" text-anchor="middle" fill="#15803d">答 A</text>
    <rect x="612" y="390" width="70" height="36" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/>
    <text x="647" y="413" class="tiny" text-anchor="middle" fill="#be123c">答 B</text>
  </g>
  <rect x="457" y="465" width="180" height="44" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="547" y="493" class="node-title" text-anchor="middle">多数投票 → A</text>
  <text x="547" y="556" class="node-sub" text-anchor="middle">N 次调用 · 只对最终答案投票</text>
  <text x="547" y="580" class="tiny" text-anchor="middle">要求答案可比较；开放长文无法投票</text>

  <!-- ToT nodes -->
  <text x="755" y="150" class="region-title" fill="#ea580c">③ Tree of Thoughts</text>
  <rect x="802" y="185" width="180" height="44" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="892" y="213" class="node-title" text-anchor="middle">问题</text>
  <rect x="780" y="260" width="64" height="36" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.8"/>
  <text x="812" y="283" class="tiny" text-anchor="middle">0.8</text>
  <rect x="860" y="260" width="64" height="36" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/>
  <text x="892" y="283" class="tiny" text-anchor="middle" fill="#be123c">0.2 剪枝</text>
  <rect x="940" y="260" width="64" height="36" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.8"/>
  <text x="972" y="283" class="tiny" text-anchor="middle">0.6</text>
  <rect x="752" y="330" width="64" height="36" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.8"/>
  <text x="784" y="353" class="tiny" text-anchor="middle" fill="#be123c">死路</text>
  <rect x="820" y="330" width="64" height="36" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.8"/>
  <text x="852" y="353" class="tiny" text-anchor="middle">0.9</text>
  <rect x="812" y="395" width="80" height="36" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="852" y="418" class="tiny" text-anchor="middle" fill="#c2410c">找到解</text>
  <text x="784" y="386" class="tiny" text-anchor="middle" fill="#be185d">回溯</text>
  <rect x="767" y="465" width="250" height="44" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <text x="892" y="493" class="node-title" text-anchor="middle">评估器给状态打分 + BFS/DFS</text>
  <text x="892" y="556" class="node-sub" text-anchor="middle">数十到上百次调用 · 显式搜索</text>
  <text x="892" y="580" class="tiny" text-anchor="middle">生成器、评估器、搜索策略都在模型外部</text>

  <!-- RL reasoning model -->
  <text x="1100" y="150" class="region-title" fill="#7c3aed">④ RL 训练的推理模型</text>
  <rect x="1107" y="185" width="260" height="255" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2.2"/>
  <text x="1127" y="212" class="mono" fill="#7c3aed">&lt;think&gt;</text>
  <text x="1127" y="240" class="mono">尝试方案 1 ……</text>
  <text x="1127" y="268" class="mono">检查：与约束矛盾</text>
  <text x="1127" y="296" class="mono" fill="#be185d">wait，回到第 2 步</text>
  <text x="1127" y="324" class="mono">尝试方案 2 ……</text>
  <text x="1127" y="352" class="mono">代入验证：成立</text>
  <text x="1127" y="380" class="mono" fill="#7c3aed">&lt;/think&gt;</text>
  <text x="1127" y="416" class="node-title">最终答案</text>
  <rect x="1107" y="465" width="260" height="44" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="1237" y="493" class="node-title" text-anchor="middle">训练：可验证奖励 + GRPO</text>
  <text x="1237" y="556" class="node-sub" text-anchor="middle">1 次调用 · 长度随难度变化</text>
  <text x="1237" y="580" class="tiny" text-anchor="middle">搜索内化进单条序列；API 只给摘要</text>

  <!-- Axis -->
  <path d="M80 660 H1360" class="line" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow-dark)"/>
  <text x="80" y="695" class="node-sub">外部程序编排搜索</text>
  <text x="1360" y="695" class="node-sub" text-anchor="end">搜索内化进模型</text>
  <text x="720" y="695" class="node-sub" text-anchor="middle">调用方对推理过程的可见性：高 → 低</text>
</svg>
