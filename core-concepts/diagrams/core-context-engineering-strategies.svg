<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870">
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L14,5.5 L0,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L14,5.5 L0,11 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L14,5.5 L0,11 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="11" refX="13" refY="5.5" orient="auto">
      <path d="M0,0 L14,5.5 L0,11 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-sub { font-size: 13.5px; fill: #536174; }
      .seg { font-size: 14.5px; font-weight: 600; }
      .seg-sub { font-size: 12px; fill: #64748b; }
      .tiny { font-size: 12.5px; fill: #64748b; }
      .label { font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1440" height="870" fill="#ffffff"/>
  <rect width="1440" height="870" fill="url(#paper)"/>

  <text x="40" y="55" class="title">上下文的组成与四类策略：写出、选择、压缩、隔离</text>
  <text x="40" y="83" class="subtitle">中间是一次请求的 Token 构成（高度示意占比）；四类策略分别把信息移出、拉入、删减或交给独立窗口</text>

  <!-- Connectors first -->
  <!-- write: memory/state -> write box -->
  <path d="M520 330 H422" class="line" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <!-- write box -> store via outer channel -->
  <path d="M60 330 H36 V660 H58" class="line" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
  <!-- store -> select (up) -->
  <path d="M240 600 V544" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <!-- select -> retrieval segment -->
  <path d="M420 475 H518" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <!-- compress: tool results -> compress box; summary back to history -->
  <path d="M920 565 H1018" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M1020 420 H922" class="line" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <!-- isolate: subagent result back to history -->
  <path d="M1020 290 H960 V380 H922" class="line" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <!-- Context window stack -->
  <text x="720" y="132" class="region-title" text-anchor="middle" fill="#ea580c">单次请求的上下文窗口</text>
  <rect x="520" y="150" width="400" height="50" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="720" y="181" class="seg" text-anchor="middle">System 指令</text>
  <rect x="520" y="200" width="400" height="70" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="720" y="231" class="seg" text-anchor="middle">工具定义</text>
  <text x="720" y="252" class="seg-sub" text-anchor="middle">工具多时占数万 Token</text>
  <rect x="520" y="270" width="400" height="35" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="720" y="293" class="seg" text-anchor="middle">示例</text>
  <rect x="520" y="305" width="400" height="50" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="720" y="336" class="seg" text-anchor="middle">记忆与任务状态</text>
  <rect x="520" y="355" width="400" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="720" y="395" class="seg" text-anchor="middle">对话历史</text>
  <text x="720" y="418" class="seg-sub" text-anchor="middle">近期原文 + 旧部分摘要</text>
  <rect x="520" y="445" width="400" height="60" fill="#f0fdf4" stroke="#34d399" stroke-width="1.6"/>
  <text x="720" y="480" class="seg" text-anchor="middle">检索结果</text>
  <rect x="520" y="505" width="400" height="120" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="720" y="558" class="seg" text-anchor="middle">工具结果</text>
  <text x="720" y="582" class="seg-sub" text-anchor="middle">长任务中最常见的膨胀源</text>
  <rect x="520" y="625" width="400" height="35" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="720" y="648" class="seg" text-anchor="middle">当前输入</text>
  <rect x="520" y="660" width="400" height="50" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="720" y="691" class="seg" text-anchor="middle" fill="#64748b">输出余量（reasoning + 回答）</text>
  <rect x="520" y="150" width="400" height="560" fill="none" stroke="#fb923c" stroke-width="2.6" filter="url(#rough)"/>
  <text x="720" y="738" class="tiny" text-anchor="middle">越靠上越稳定，越利于缓存命中</text>

  <!-- Left: write / select / store -->
  <rect x="60" y="250" width="360" height="130" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="240" y="283" class="node-title" text-anchor="middle">写出 Write</text>
  <text x="240" y="310" class="node-sub" text-anchor="middle">scratchpad · todo · NOTES.md</text>
  <text x="240" y="334" class="node-sub" text-anchor="middle">memory tool · 进度文件</text>
  <text x="240" y="360" class="tiny" text-anchor="middle">保存可继续执行的状态</text>

  <rect x="60" y="410" width="360" height="130" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="240" y="443" class="node-title" text-anchor="middle">选择 Select</text>
  <text x="240" y="470" class="node-sub" text-anchor="middle">RAG · 记忆检索 · 工具筛选</text>
  <text x="240" y="494" class="node-sub" text-anchor="middle">just-in-time：路径与引用，按需读取</text>
  <text x="240" y="520" class="tiny" text-anchor="middle">只装入当前步骤需要的信息</text>

  <rect x="60" y="600" width="360" height="110" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="240" y="635" class="node-title" text-anchor="middle">窗口外状态</text>
  <text x="240" y="662" class="node-sub" text-anchor="middle">文件 · 记忆 · 索引 · 沙箱变量</text>
  <text x="240" y="686" class="tiny" text-anchor="middle">可恢复但暂时不用的信息</text>

  <!-- Right: isolate / compress -->
  <rect x="1020" y="150" width="360" height="160" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="1200" y="183" class="node-title" text-anchor="middle">隔离 Isolate</text>
  <rect x="1050" y="200" width="140" height="60" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="1120" y="226" class="seg-sub" text-anchor="middle">子 Agent 窗口</text>
  <text x="1120" y="246" class="seg-sub" text-anchor="middle">搜索与试错</text>
  <rect x="1210" y="200" width="140" height="60" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="1280" y="226" class="seg-sub" text-anchor="middle">沙箱状态</text>
  <text x="1280" y="246" class="seg-sub" text-anchor="middle">大对象留在环境</text>
  <text x="1200" y="290" class="tiny" text-anchor="middle">只交回 1–2k Token 精炼结果或引用</text>

  <rect x="1020" y="380" width="360" height="230" rx="16" fill="#ffffff" stroke="#ea580c" stroke-width="2.2"/>
  <text x="1200" y="413" class="node-title" text-anchor="middle">压缩 Compress</text>
  <rect x="1050" y="430" width="300" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.4"/>
  <text x="1200" y="458" class="seg-sub" text-anchor="middle">① 截断：单条工具输出设上限</text>
  <rect x="1050" y="484" width="300" height="44" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
  <text x="1200" y="512" class="seg-sub" text-anchor="middle">② 清理：旧工具结果换成占位符</text>
  <rect x="1050" y="538" width="300" height="44" rx="10" fill="#ffedd5" stroke="#fb923c" stroke-width="1.4"/>
  <text x="1200" y="566" class="seg-sub" text-anchor="middle">③ 摘要：旧历史替换为交接摘要</text>
  <text x="1200" y="600" class="tiny" text-anchor="middle">由轻到重，信息损失递增</text>

  <!-- Arrow labels -->
  <text x="470" y="318" class="label" fill="#16a34a" text-anchor="middle">移出</text>
  <text x="470" y="463" class="label" fill="#2563eb" text-anchor="middle">按需拉入</text>
  <text x="970" y="553" class="label" fill="#ea580c" text-anchor="middle">删减</text>
  <text x="966" y="442" class="label" fill="#ea580c" text-anchor="middle">摘要回填</text>
  <text x="998" y="345" class="label" fill="#7c3aed" text-anchor="middle">精炼结果</text>

  <!-- Legend -->
  <g>
    <rect x="40" y="775" width="1360" height="62" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/>
    <path d="M70 806 H120" class="line" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="132" y="811" class="node-sub">写出：状态移到窗口外</text>
    <path d="M360 806 H410" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="422" y="811" class="node-sub">选择：只拉入相关信息</text>
    <path d="M650 806 H700" class="line" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="712" y="811" class="node-sub">压缩：删减已有内容</text>
    <path d="M920 806 H970" class="line" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-purple)"/>
    <text x="982" y="811" class="node-sub">隔离：独立窗口吸收噪声</text>
    <text x="1380" y="811" class="tiny" text-anchor="end">四类划分参考 LangChain</text>
  </g>
</svg>
