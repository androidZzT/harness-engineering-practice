<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920">
<defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #536174; }
      .tiny { font-size: 13px; fill: #64748b; }
      .chip { font-size: 13px; font-weight: 600; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
<rect width="1440" height="920" fill="#ffffff"/>
<rect width="1440" height="920" fill="url(#paper)"/>
<text x="55" y="55" class="title">可运行环境与反馈回路</text>
<text x="55" y="83" class="subtitle">Agent 的每次修改都要经过由快到慢的验证信号；失败信息回写上下文，进度写入仓库供下一会话继续</text>
<rect x="75" y="338" width="1290" height="150" rx="24" fill="#f8fbff" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
<path d="M720 192 V223" class="line" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<path d="M720 297 V336" class="line" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<path d="M385 433 H413" class="line" stroke="#475569" stroke-width="3"  marker-end="url(#arrow-gray)"/>
<path d="M705 433 H733" class="line" stroke="#475569" stroke-width="3"  marker-end="url(#arrow-gray)"/>
<path d="M1025 433 H1053" class="line" stroke="#475569" stroke-width="3"  marker-end="url(#arrow-gray)"/>
<path d="M720 488 V508" class="line" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<path d="M720 620 V658" class="line" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<path d="M720 730 V763" class="line" stroke="#2563eb" stroke-width="3"  marker-end="url(#arrow-blue)"/>
<path d="M550 565 H412" class="line" stroke="#ea580c" stroke-width="3"  marker-end="url(#arrow-orange)"/>
<path d="M110 565 H52 V261 H518" class="line" stroke="#ea580c" stroke-width="3"  marker-end="url(#arrow-orange)"/>
<path d="M920 799 H1395 V156 H922" class="line" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-purple)"/>
<rect x="520" y="120" width="400" height="72" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
<text x="720.0" y="150" class="node-title" text-anchor="middle">任务规格与完成标准</text>
<text x="720.0" y="175" class="node-sub" text-anchor="middle">功能清单（初始全部 failing）、验收条件、init.sh</text>
<rect x="520" y="225" width="400" height="72" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text x="720.0" y="255" class="node-title" text-anchor="middle">Agent 修改代码</text>
<text x="720.0" y="280" class="node-sub" text-anchor="middle">一次只推进一个功能，改动保持可回滚</text>
<text x="100" y="366" class="region-title" fill="#2563eb">验证信号：由快到慢、由机械到语义</text>
<rect x="95" y="393" width="290" height="80" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
<text x="240.0" y="423" class="node-title" text-anchor="middle">类型检查 / 编译</text>
<text x="240.0" y="448" class="node-sub" text-anchor="middle">秒级：接口与签名错误</text>
<rect x="415" y="393" width="290" height="80" rx="16" fill="#ffffff" stroke="#fbbf24" stroke-width="2"/>
<text x="560.0" y="423" class="node-title" text-anchor="middle">Lint / 结构测试</text>
<text x="560.0" y="448" class="node-sub" text-anchor="middle">秒级：架构分层与约定</text>
<rect x="735" y="393" width="290" height="80" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text x="880.0" y="423" class="node-title" text-anchor="middle">单元 / 集成测试</text>
<text x="880.0" y="448" class="node-sub" text-anchor="middle">分钟级：行为是否正确</text>
<rect x="1055" y="393" width="290" height="80" rx="16" fill="#ffffff" stroke="#f472b6" stroke-width="2"/>
<text x="1200.0" y="423" class="node-title" text-anchor="middle">E2E / 浏览器 / 观测</text>
<text x="1200.0" y="448" class="node-sub" text-anchor="middle">截图、日志、指标、trace</text>
<polygon points="720,510 890,565 720,620 550,565" fill="#ffffff" stroke="#fbbf24" stroke-width="2.2"/>
<text x="720" y="571" class="node-title" text-anchor="middle">全部通过？</text>
<rect x="110" y="529" width="300" height="72" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
<text x="260.0" y="559" class="node-title" text-anchor="middle">失败信息回写上下文</text>
<text x="260.0" y="584" class="node-sub" text-anchor="middle">错误摘要、失败用例、相关日志</text>
<rect x="520" y="660" width="400" height="70" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
<text x="720.0" y="690" class="node-title" text-anchor="middle">完成前检查</text>
<text x="720.0" y="715" class="node-sub" text-anchor="middle">对照规格逐项核验，防止过早宣布完成</text>
<rect x="520" y="765" width="400" height="70" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text x="720.0" y="795" class="node-title" text-anchor="middle">提交与交接</text>
<text x="720.0" y="820" class="node-sub" text-anchor="middle">git commit、进度文件、PR 与人工审查</text>
<text x="480" y="553" class="label" fill="#ea580c" text-anchor="middle">否</text>
<text x="735" y="646" class="label" fill="#2563eb">是</text>
<text x="70" y="300" class="tiny">修复后重跑</text>
<text x="945" y="788" class="tiny">跨上下文窗口：下一会话先读进度文件与 git log</text>
<text x="945" y="140" class="tiny">长任务续跑</text>
<text x="55" y="888" class="tiny">蓝色：主路径</text><text x="220" y="888" class="tiny">橙色：失败修复回路</text><text x="420" y="888" class="tiny">紫色虚线：跨会话续跑</text>
</svg>