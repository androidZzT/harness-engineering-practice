<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820">
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#334155"/></marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#16a34a"/></marker>
    <marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#db2777"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 16px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #536174; }
      .tiny { font-size: 12px; fill: #64748b; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; font-size: 12.5px; fill: #172033; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect width="100%" height="100%" fill="url(#paper)"/>
  <text x="55" y="55" class="title">计划的生命周期：审批、外部状态与完成审计</text>
  <text x="55" y="83" class="subtitle">计划放在模型上下文之外；压缩、重启或换会话后，Agent 从外部状态而不是聊天记录恢复</text>

  <!-- Store region -->
  <rect x="800" y="120" width="585" height="500" rx="24" fill="#fbf9ff" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>

  <!-- Main path -->
  <path d="M420 194 V221" class="line" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M420 289 V321" class="line" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M420 415 V451" class="line" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)"/>
  <path d="M420 519 V561" class="line" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrow-green)"/>

  <!-- Loops on left channel -->
  <path d="M220 255 H170 V160 H216" class="line" stroke="#db2777" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-pink)"/>
  <path d="M220 485 H170 V368 H216" class="line" stroke="#db2777" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow-pink)"/>

  <!-- Store connectors -->
  <path d="M620 255 H796" class="line" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <path d="M620 352 H796" class="line" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <path d="M800 390 H624" class="line" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <path d="M800 485 H624" class="line" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <path d="M1090 690 V624" class="line" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>

  <!-- Main nodes -->
  <rect x="220" y="130" width="400" height="64" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2.2"/>
  <text x="420" y="158" class="node-title" text-anchor="middle">Plan Mode：只读探索 + 澄清取舍</text>
  <text x="420" y="181" class="tiny" text-anchor="middle">禁止编辑由权限层强制，而非提示词自觉</text>

  <rect x="220" y="225" width="400" height="64" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2.2"/>
  <text x="420" y="253" class="node-title" text-anchor="middle">提交“决策完备”的计划 → 人工审批</text>
  <text x="420" y="276" class="tiny" text-anchor="middle">可直接编辑计划；可批准并清空规划上下文</text>

  <rect x="220" y="325" width="400" height="90" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2.2"/>
  <text x="420" y="353" class="node-title" text-anchor="middle">执行循环</text>
  <text x="420" y="378" class="node-sub" text-anchor="middle">读状态 → 做一个可验证单元 → 验证 → 写回</text>
  <text x="420" y="400" class="tiny" text-anchor="middle">同一时刻一个 in_progress；假设被推翻时改计划并记原因</text>

  <rect x="220" y="455" width="400" height="64" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2.2"/>
  <text x="420" y="483" class="node-title" text-anchor="middle">完成审计：逐条需求核对证据</text>
  <text x="420" y="506" class="tiny" text-anchor="middle">证据间接或缺失视为未完成</text>

  <rect x="220" y="565" width="400" height="56" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="420" y="599" class="node-title" text-anchor="middle">目标标记 complete（显式状态转换）</text>

  <!-- Loop labels -->
  <rect x="60" y="196" width="100" height="22" fill="#ffffff"/>
  <text x="110" y="212" class="tiny" text-anchor="middle" fill="#be185d">审批被拒</text>
  <rect x="60" y="416" width="100" height="22" fill="#ffffff"/>
  <text x="110" y="432" class="tiny" text-anchor="middle" fill="#be185d">证据不足</text>

  <!-- Store connector labels -->
  <text x="708" y="243" class="tiny" text-anchor="middle">写入已批准计划</text>
  <text x="708" y="340" class="tiny" text-anchor="middle">更新状态 / 检查点</text>
  <text x="712" y="408" class="tiny" text-anchor="middle" fill="#15803d">注入未完成项</text>
  <text x="712" y="503" class="tiny" text-anchor="middle" fill="#15803d">需求与证据来源</text>

  <!-- Store contents -->
  <text x="825" y="157" class="region-title" fill="#7c3aed">外部持久状态（模型上下文之外）</text>
  <rect x="830" y="180" width="525" height="84" rx="14" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="850" y="208" class="node-title">计划 / 任务列表</text>
  <text x="850" y="232" class="mono">{ id, step, status, depends_on, verify }</text>
  <text x="850" y="252" class="tiny">压缩后只重新注入 pending / in_progress 项</text>
  <rect x="830" y="280" width="525" height="84" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="850" y="308" class="node-title">需求清单（JSON）</text>
  <text x="850" y="332" class="mono">{ "feature": "…", "passes": false }</text>
  <text x="850" y="352" class="tiny">只有验证通过才能改为 true</text>
  <rect x="830" y="380" width="525" height="84" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="850" y="408" class="node-title">进度日志 + git 检查点</text>
  <text x="850" y="432" class="node-sub">每个会话追加做了什么；可回滚到可用状态</text>
  <text x="850" y="452" class="tiny">新会话先读日志与 git log，再挑下一个未完成项</text>
  <rect x="830" y="480" width="525" height="110" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="850" y="508" class="node-title">持久目标</text>
  <text x="850" y="532" class="mono">{ objective, status, token_budget, usage }</text>
  <text x="850" y="556" class="node-sub">status: active → complete / blocked</text>
  <text x="850" y="578" class="tiny">空闲且 active 时 Runtime 自动注入续作指令</text>

  <!-- Recovery -->
  <rect x="880" y="694" width="420" height="80" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <text x="1090" y="726" class="node-title" text-anchor="middle">上下文压缩 / 进程重启 / 新会话</text>
  <text x="1090" y="752" class="node-sub" text-anchor="middle">从外部状态恢复进度，不依赖聊天摘要</text>
</svg>
