  <text x="1335" y="605" class="node-title" text-anchor="middle">Agent</text>
  <rect x="980.0" y="710.0" width="90" height="40" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1025" y="735" class="node-title" text-anchor="middle">Agent</text>
  <rect x="1290.0" y="710.0" width="90" height="40" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1335" y="735" class="node-title" text-anchor="middle">Agent</text>
  <text x="65" y="400" class="node-sub" text-anchor="start">控制：主 Agent 动态拆解、派发、汇总</text>
  <text x="65" y="425" class="node-sub" text-anchor="start">状态：Worker 上下文互相隔离</text>
  <text x="65" y="450" class="node-sub" text-anchor="start" fill="#be123c">风险：主 Agent 成为瓶颈，交接有损</text>
  <text x="650.0" y="226" class="tiny" text-anchor="middle">transfer</text>
  <text x="790.0" y="226" class="tiny" text-anchor="middle">transfer</text>
  <text x="782" y="305" class="tiny" text-anchor="start">只和当前活跃 Agent 对话</text>
  <text x="525" y="400" class="node-sub" text-anchor="start">控制：当前 Agent 决定把会话交给谁</text>
  <text x="525" y="425" class="node-sub" text-anchor="start">状态：接手方默认看到完整历史</text>
  <text x="525" y="450" class="node-sub" text-anchor="start" fill="#be123c">风险：来回踢皮球，无人对全局负责</text>
  <text x="985" y="400" class="node-sub" text-anchor="start">控制：逐级分解，逐级汇报</text>
  <text x="985" y="425" class="node-sub" text-anchor="start">状态：每层只看下一层的汇总</text>
  <text x="985" y="450" class="node-sub" text-anchor="start" fill="#be123c">风险：层数越多，信息衰减越严重</text>
  <text x="310.0" y="729" class="tiny" text-anchor="middle" fill="#be185d">不通过则回到实现（有上限）</text>
  <text x="65" y="795" class="node-sub" text-anchor="start">控制：代码预先定义阶段与依赖</text>
  <text x="65" y="820" class="node-sub" text-anchor="start">状态：阶段之间交接产物文件</text>
  <text x="65" y="845" class="node-sub" text-anchor="start" fill="#be123c">风险：灵活性低，上游错误向下传递</text>
  <text x="650.0" y="585" class="tiny" text-anchor="middle">互相质疑</text>
  <text x="790.0" y="585" class="tiny" text-anchor="middle">互相质疑</text>
  <text x="525" y="795" class="node-sub" text-anchor="start">控制：独立求解后聚合或裁决</text>
  <text x="525" y="820" class="node-sub" text-anchor="start">状态：同一问题，多份独立答案</text>
  <text x="525" y="845" class="node-sub" text-anchor="start" fill="#be123c">风险：成本成倍，相关错误无法抵消</text>
  <text x="985" y="795" class="node-sub" text-anchor="start">控制：Agent 按状态认领任务，或由调度器触发</text>
  <text x="985" y="820" class="node-sub" text-anchor="start">状态：看板是唯一事实来源</text>
  <text x="985" y="845" class="node-sub" text-anchor="start" fill="#be123c">风险：并发写冲突，需要锁与状态机</text>
</svg>
