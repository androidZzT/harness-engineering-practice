  <rect x="505" y="110" width="430" height="370" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <text x="525" y="144" class="region-title" fill="#7c3aed">② Handoff / Swarm</text>
  <rect x="965" y="110" width="430" height="370" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <text x="985" y="144" class="region-title" fill="#ea580c">③ Supervisor / 层级</text>
  <rect x="45" y="505" width="430" height="370" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#34d399" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <text x="65" y="539" class="region-title" fill="#059669">④ Pipeline / DAG</text>
  <rect x="505" y="505" width="430" height="370" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#f472b6" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <text x="525" y="539" class="region-title" fill="#db2777">⑤ 并行投票 / 辩论</text>
  <rect x="965" y="505" width="430" height="370" rx="22" fill="#ffffff" fill-opacity="0.6" stroke="#94a3b8" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
  <text x="985" y="539" class="region-title" fill="#475569">⑥ Blackboard / 共享状态</text>
