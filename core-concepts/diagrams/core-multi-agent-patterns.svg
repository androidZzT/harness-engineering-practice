  <text x="1180.0" y="659" class="node-title" text-anchor="middle">任务看板 / 共享存储</text>
  <text x="1180.0" y="683" class="tiny" text-anchor="middle">任务、状态、产物、锁</text>
  <rect x="980.0" y="580.0" width="90" height="40" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1025" y="605" class="node-title" text-anchor="middle">Agent</text>
