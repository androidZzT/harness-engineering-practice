<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
<defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #536174; }
      .region-title { font-size: 19px; font-weight: 700; }
      .node-title { font-size: 17px; font-weight: 650; }
      .node-sub { font-size: 13px; fill: #536174; }
      .tiny { font-size: 13px; fill: #64748b; }
      .chip { font-size: 13px; font-weight: 600; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
<rect width="1440" height="900" fill="#ffffff"/>
<rect width="1440" height="900" fill="url(#paper)"/>
<text x="55" y="55" class="title">Agent = Model + Harness：Harness 的组成</text>
<text x="55" y="83" class="subtitle">模型负责判断下一步，其余让它可靠工作的工程都属于 Harness；方框中的数字为本系列篇号</text>
<rect x="45" y="115" width="1350" height="175" rx="24" fill="#fbf9ff" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
<text x="70" y="149" class="region-title" fill="#7c3aed">① 模型侧能力：由 Harness 决定何时启用、如何装配</text>
<rect x="45" y="315" width="1350" height="265" rx="24" fill="#f8fbff" stroke="#60a5fa" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
<text x="70" y="349" class="region-title" fill="#2563eb">② Agent Loop（03）：每轮重建请求 → 采样 → 执行 → 回填</text>
<rect x="45" y="605" width="1350" height="215" rx="24" fill="#fffaf2" stroke="#fb923c" stroke-width="2.2" stroke-dasharray="9 6" filter="url(#rough)"/>
<text x="70" y="639" class="region-title" fill="#ea580c">③ 横切能力与编排：贯穿每一轮</text>
<path d="M1270 480 V532 H390 V484" class="line" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)"/>
<path d="M265 430 H293" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M485 430 H513" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M705 430 H733" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M925 430 H953" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
<path d="M1145 430 H1173" class="line" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
<text x="830" y="558" class="tiny" text-anchor="middle">tool result 回填，进入下一轮；无工具调用且满足停止条件时结束</text>
<rect x="75" y="170" width="230" height="95" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
<text x="190.0" y="210" class="node-title" text-anchor="middle">Prompt · 12</text>
<text x="190.0" y="238" class="node-sub" text-anchor="middle">指令、工具描述、示例</text>
