<text x="55" y="862" class="tiny">蓝色箭头：单轮主路径</text><text x="260" y="862" class="tiny">绿色回路：工具结果回填到下一轮</text><text x="530" y="862" class="tiny">区域位置表示职责分层，不表示调用顺序</text>
